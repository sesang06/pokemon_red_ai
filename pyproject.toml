[project]
name = "pokemon-red-agent"
version = "0.1.0"
description = "A PyBoy, MCP, and Google ADK agent runtime for Pokemon Red."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "google-adk>=2,<3",
    "mcp[cli]>=2,<3",
    "pillow>=10.0",
    "pyside6>=6.7",
    "pyboy>=2.0",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pokemon-play = "pokemon_agent.cli.manual_play:main"
pokemon-agent = "pokemon_agent.app:main"
pokemon-adk = "pokemon_agent.adk_agent.runner:main"
pokemon-mcp = "pokemon_agent.mcp_server:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pokemon_agent.dashboard" = ["static/index.html", "static/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
